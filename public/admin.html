<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مدیریت رزروها | قصر پیرایش</title><link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700&display=swap" rel="stylesheet"><style>
body{font-family:Vazirmatn,Tahoma;background:#101010;color:#eee;margin:0;padding:25px}.box{max-width:1000px;margin:auto}.panel{background:#1b1b1b;border:1px solid #51452f;border-radius:12px;padding:22px;margin:18px 0}input,button{font:14px Vazirmatn;padding:10px;border-radius:7px;border:1px solid #555;background:#111;color:#fff}button{background:#d6b36a;color:#111;border:0;cursor:pointer;font-weight:bold}.row{display:flex;gap:10px;flex-wrap:wrap}table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:11px;border-bottom:1px solid #444;text-align:right}th{color:#d6b36a}.pending{color:#e6bd68}.approved{color:#8bd49b}.rejected{color:#e78d8d}.small{font-size:12px;color:#aaa}.actions button{margin:2px}.hide{display:none}
</style></head><body><div class="box"><h1 style="color:#d6b36a">پنل مدیریت قصر پیرایش</h1><div class="panel" id="login"><p>برای مشاهده درخواست‌های رزرو، رمز مدیر را وارد کنید.</p><div class="row"><input id="password" type="password" placeholder="رمز عبور مدیر"><button id="loginBtn">ورود</button></div><div id="loginMsg" class="small"></div></div>
<div class="panel hide" id="dashboard"><div class="row"><input type="date" id="filterDate"><button id="refresh">به‌روزرسانی</button><button id="all">همه رزروها</button></div><p class="small">درخواست‌های «در انتظار» هنوز قطعی نشده‌اند.</p><div style="overflow:auto"><table><thead><tr><th>مشتری</th><th>خدمت</th><th>تاریخ</th><th>ساعت</th><th>مبلغ</th><th>وضعیت</th><th>اقدام</th></tr></thead><tbody id="rows"></tbody></table></div><div id="msg" class="small"></div></div></div>
<script>
let token="";const $=id=>document.getElementById(id);
$("loginBtn").onclick=async()=>{const r=await fetch("/api/admin/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:$("password").value})});const d=await r.json();if(!r.ok){$("loginMsg").textContent=d.error;return;}token=d.token;$("login").classList.add("hide");$("dashboard").classList.remove("hide");load();};
async function load(date){const url="/api/admin/bookings"+(date?"?date="+date:"");const r=await fetch(url,{headers:{"x-admin-token":token}});const data=await r.json();if(!r.ok){$("msg").textContent=data.error;return;}const body=$("rows");body.innerHTML="";data.forEach(b=>{const tr=document.createElement("tr");const status={pending:"در انتظار تأیید",approved:"تأیید شده",rejected:"رد شده"};tr.innerHTML=`<td>${esc(b.customer_name)}<div class="small">${esc(b.phone)}</div></td><td>${esc(b.service_name)}</td><td>${b.booking_date}</td><td>${b.start_time} تا ${b.end_time}</td><td>${Number(b.price).toLocaleString("fa-IR")} تومان</td><td class="${b.status}">${status[b.status]}</td><td class="actions"></td>`;const cell=tr.lastElementChild;if(b.status==="pending"){const ok=document.createElement("button");ok.textContent="تأیید";ok.onclick=()=>change(b.id,"approved");const no=document.createElement("button");no.textContent="رد";no.onclick=()=>change(b.id,"rejected");cell.append(ok,no);}const wa=document.createElement("a");wa.href="https://wa.me/"+b.phone.replace(/\D/g,"");wa.target="_blank";wa.textContent="واتساپ";wa.style.color="#d6b36a";cell.append(wa);body.append(tr);});}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
async function change(id,status){const r=await fetch("/api/admin/bookings/"+id,{method:"PATCH",headers:{"Content-Type":"application/json","x-admin-token":token},body:JSON.stringify({status})});const d=await r.json();$("msg").textContent=r.ok?"وضعیت رزرو به‌روزرسانی شد.":d.error;load($("filterDate").value);}
$("refresh").onclick=()=>load($("filterDate").value);$("all").onclick=()=>{$("filterDate").value="";load();};
</script></body></html>
